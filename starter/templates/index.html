<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="difficulty-control">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <span id="selected-difficulty" aria-live="polite">Medium</span>
  </div>
  <div class="timer" aria-live="polite">
    <span>Time</span>
    <span id="timer" aria-label="Elapsed time">00:00</span>
  </div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint">Hint</button>
    <button id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">Dark Mode</button>
    <span id="message" role="status" aria-live="polite"></span>
  </div>
  <section class="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10 Leaderboard</h2>
    <ol id="leaderboard-list" class="leaderboard-list"></ol>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
